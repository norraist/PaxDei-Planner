name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.2.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".TrimStart("v")
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG_NAME=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Update pyproject.toml version
        shell: pwsh
        run: |
          $path = "pyproject.toml"
          $appVersion = $env:APP_VERSION
          $lines = Get-Content -Path $path
          $inProject = $false
          $updated = $false
          $output = foreach ($line in $lines) {
            $trim = $line.Trim().TrimStart([char]0xFEFF)
            if ($trim.StartsWith("[") -and $trim.EndsWith("]")) {
              $inProject = ($trim -eq "[project]")
            }
            if ($inProject -and $trim -match '^(version\s*=)') {
              $updated = $true
              "$($matches[1]) `"$appVersion`""
            } else {
              $line
            }
          }
          if (-not $updated) {
            Write-Error "No version line updated in pyproject.toml"
            exit 1
          }
          Set-Content -Path $path -Value $output -Encoding UTF8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync

      - name: Build PyInstaller bundle
        run: |
          uv run pyinstaller packaging/windows/paxdei_ui.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: iscc /DAppVersion=${{ env.APP_VERSION }} packaging/windows/installer.iss

      - name: Package portable zip
        run: |
          Compress-Archive -Path dist/paxdei_planner_ui/* -DestinationPath dist/PaxDeiPlanner_Portable.zip

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: PaxDeiPlanner ${{ env.APP_VERSION }}
          files: |
            packaging/windows/PaxDeiPlanner_Setup.exe
            dist/PaxDeiPlanner_Portable.zip
